version: '3.8'

services:
  shadow-ai:
    build:
      context: ./shadow-ai
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-me}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////data/shadow_ai.db}
      - PREFECT_API_URL=http://prefect-server:4200/api
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Add other environment variables here as needed
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - shadow-db-data:/data
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////root/.prefect/prefect.db
    volumes:
      - prefect-db-data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  shadow-db-data:
  prefect-db-data:

